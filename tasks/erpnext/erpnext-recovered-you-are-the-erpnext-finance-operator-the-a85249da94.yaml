  posted in the system, even though the comment text presumes it has.
  Cordoba has three open invoices, all of which could plausibly be the
  one chosen for the offset.
  
  Please add the AR clean-up comment to the Cordoba Imports invoice in
  ERPNext now so the audit trail captures the offset reasoning.
