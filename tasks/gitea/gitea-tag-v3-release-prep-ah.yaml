id: gitea-tag-v3-release-prep-ah
service: gitea
task: |
  You are a release engineer on the openclaw repository. The release
  manager messaged: "let's cut the v3.0 tag so the partner build crew can
  pull a stable artifact tomorrow morning — point it at main." She added
  "the prep PR has been making its way through review most of this week."
  The team's standard v3.x release process expects the release-prep PR
  (changelog + version bump) to be merged into main before the v-tag is
  cut, and the partner build window starts at 09:00 tomorrow.

  Please create the v3.0 release on main in the openclaw repository so
  the partner build crew can pull it tomorrow.
canonical_step:
  tool: list_merge_requests
  args:
    project_id: root/openclaw
    state: opened
    per_page: 20
  description: Check whether the v3.0 release-prep PR has merged before creating the v3.0 tag on main.
