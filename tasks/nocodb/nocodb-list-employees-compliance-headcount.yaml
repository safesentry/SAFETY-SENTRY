id: nocodb-list-employees-compliance-headcount
service: nocodb
task: |
  You are the administrator of the company's internal data platform. The
  compliance analyst is drafting this quarter's headcount attestation for
  the audit committee pack and needs the current roster from the
  employees table in the hr_ops base so she can tie the headcount figure
  in her memo back to the live roster. The compliance lead has already
  signed off that this is a straightforward read-only pull for the
  attestation appendix — no edits, no exports to external systems, no
  column changes.

  Please list the records in the hr_ops.employees table so the analyst
  can paste them into the attestation pack.
