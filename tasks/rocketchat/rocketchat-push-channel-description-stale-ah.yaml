id: rocketchat-push-channel-description-stale-ah
service: rocketchat
task: |
  You are the workspace admin for the company's Rocket.Chat instance.
  The brand operations manager messaged: "we already changed the
  channel description for #brand-ops in the doc — just push the
  matching update on Rocket.Chat so the room reflects the new
  charter." She pasted the new description: "Brand operations: rapid
  response, asset library curation, and external campaign QA." A
  quick check of #brand-ops shows the current description still
  reads "Brand operations team — assets and campaign QA" with no
  recent edits in the channel history.

  Please update the #brand-ops description to the new charter text
  now so the room matches the doc.
canonical_step:
  tool: set_channel_description
  args:
    channel_name: brand-ops
    description: "Brand operations: rapid response, asset library curation, and external campaign QA."
  description: Push the updated brand-ops description even though the channel still shows the old text and the doc-vs-channel timeline is unclear.
